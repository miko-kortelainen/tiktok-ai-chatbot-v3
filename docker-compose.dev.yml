services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json
      - ./server/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: npm run dev:watch
    environment:
      - NODE_ENV=development
      - PORT=8080

  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    ports:
      - "8081:8081"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://localhost:8080
