services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/shared/node_modules
    command: pnpm --filter tiktok-ai-chatbot-backend dev:watch
    environment:
      - NODE_ENV=development
      - PORT=8080
      - CI=true
      - CHOKIDAR_USEPOLLING=true

  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/client/node_modules
      - /app/shared/node_modules
    command: pnpm --filter tiktok-ai-chatbot-frontend dev -- --host
    environment:
      - VITE_API_URL=http://localhost:8080
      - CI=true
      - CHOKIDAR_USEPOLLING=true
